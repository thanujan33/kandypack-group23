name: Check KandyPack
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-only-password
          MYSQL_DATABASE: kandypack
        ports: ["3307:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -pci-only-password"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3307
      DB_NAME: kandypack
      DB_ADMIN_USER: root
      DB_ADMIN_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: docker build -t kandypack:ci .
